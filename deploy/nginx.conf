map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name 101.200.191.177;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://101.200.191.177$request_uri; }
}
server {
    listen 443 ssl;
    server_name 101.200.191.177;
    ssl_certificate /etc/letsencrypt/live/101.200.191.177/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/101.200.191.177/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 21m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
